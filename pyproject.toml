[project]
name = "sparrow-model-uploader"
version = "0.1.0"
description = "Convert, validate and package a model for submission to the Sparrow Engine model zoo."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.0",
  "onnx>=1.17",
  "onnxruntime>=1.20",
]

[project.urls]
Homepage = "https://github.com/microsoft/Sparrow-Model-Zoo-Uploader"
Issues = "https://github.com/microsoft/Sparrow-Model-Zoo-Uploader/issues"

[project.optional-dependencies]
# Conversion-time only. Ultralytics is AGPL-3.0; it never ships inside a bundle.
ultralytics = ["torch>=2.6", "torchvision>=0.21", "ultralytics>=8.3"]
submit = ["huggingface_hub>=0.25"]

[project.scripts]
sparrow-uploader = "sparrow_uploader.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sparrow_uploader"]

[tool.hatch.build.targets.wheel.force-include]
"skills/sparrow-model-uploader" = "sparrow_uploader/_skill/sparrow-model-uploader"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
